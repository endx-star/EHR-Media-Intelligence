<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EHR Media Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-5xl px-6 py-12">
    <header class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-widest text-blue-700">Clinical workspace</p>
      <h1 class="mt-2 text-3xl font-bold">EHR Media Intelligence</h1>
      <p class="mt-2 text-slate-600">Search and understand patient media records in one place.</p>
    </header>
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold">Ingestion API connection check</h2>
      <p class="mt-1 text-sm text-slate-600">Task 1 foundation. Search UI will be added after the semantic search API is ready.</p>
      <button id="health-check" class="mt-4 rounded-lg bg-blue-700 px-4 py-2 font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Check backend</button>
      <p id="health-status" class="mt-3 text-sm" role="status" aria-live="polite">Backend status has not been checked.</p>
    </section>
  </main>
  <script src="./js/api.js"></script>
</body>
</html>
